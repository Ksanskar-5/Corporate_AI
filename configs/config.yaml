# ============================================================
# Central Configuration — Adaptive Synthetic Email Generation
# ============================================================

project:
  name: "Adaptive Synthetic Email Generation"
  team_id: "MDM-DS-033"
  random_seed: 42

data:
  raw_path: "data/raw/enron_data_fraud_labeled.csv"
  sample_size: 50000  # Initial subset for fast experimentation
  test_ratio: 0.2

preprocessing:
  remove_duplicates: true
  strip_html: true
  normalize_whitespace: true
  min_body_length: 10
  max_body_length: 5000

features:
  text:
    tfidf_max_features: 10000
    embedding_model: "all-MiniLM-L6-v2"
    n_topics: 20
  metadata:
    time_bins: 24
    network_min_edges: 2

generation:
  approaches:
    - "statistical"
    - "lm_based"
    - "rag"
  n_synthetic_emails: 10000
  lm:
    model_name: "gpt2"
    max_length: 512
    temperature: 0.8
    top_p: 0.95
  rag:
    retriever_model: "all-MiniLM-L6-v2"
    top_k: 5

evaluation:
  semantic:
    similarity_threshold: 0.7
  privacy:
    exact_match: true
    near_duplicate_threshold: 0.95
    ngram_overlap_n: 4
  utility:
    classifiers:
      - "logistic_regression"
      - "random_forest"
      - "xgboost"
    tstr_test_ratio: 0.2
  diversity:
    min_unique_ratio: 0.9

output:
  figures_dir: "outputs/figures"
  models_dir: "outputs/models"
  synthetic_data_dir: "outputs/synthetic_data"

dashboard:
  port: 8501
  theme: "dark"
